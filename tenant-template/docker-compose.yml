version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tenant-app-${TENANT_NAME:-default}
    environment:
      - APP_ENV=production
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=tenant_db
      - DB_USERNAME=tenant_user
      - DB_PASSWORD=tenant_pass
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - .:/var/www/html
    ports:
      - "${SSH_PORT:-2201}:22"
    restart: unless-stopped
    networks:
      - tenant_net

  web:
    image: nginx:alpine
    container_name: tenant-web-${TENANT_NAME:-default}
    ports:
      - "${HTTP_PORT:-9001}:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - tenant_net

  db:
    image: postgres:16-alpine
    container_name: tenant-db-${TENANT_NAME:-default}
    environment:
      - POSTGRES_DB=tenant_db
      - POSTGRES_USER=tenant_user
      - POSTGRES_PASSWORD=tenant_pass
    volumes:
      - tenant_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - tenant_net

  redis:
    image: redis:alpine
    container_name: tenant-redis-${TENANT_NAME:-default}
    restart: unless-stopped
    networks:
      - tenant_net

volumes:
  tenant_db_data:

networks:
  tenant_net:
    driver: bridge
