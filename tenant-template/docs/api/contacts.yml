openapi: 3.0.3
info:
  title: Tenant Contacts API
  description: API endpoints for managing customers and suppliers at the POS.
  version: 1.0.0
servers:
  - url: /api
    description: Tenant API
paths:
  /contacts:
    get:
      summary: List all contacts
      tags:
        - Contacts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A JSON array of contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Contact'
    post:
      summary: Create a new contact
      tags:
        - Contacts
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactInput'
      responses:
        '201':
          description: Contact created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '422':
          description: Validation error

  /contacts/{id}:
    get:
      summary: Get a specific contact
      tags:
        - Contacts
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Contact details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '404':
          description: Contact not found
    put:
      summary: Update a contact
      tags:
        - Contacts
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactInput'
      responses:
        '200':
          description: Contact updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '404':
          description: Contact not found
    delete:
      summary: Delete a contact
      tags:
        - Contacts
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Contact deleted successfully
        '404':
          description: Contact not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Contact:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "Alice Smith"
        phone_number:
          type: string
          example: "254712345678"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ContactInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: "Alice Smith"
        phone_number:
          type: string
          example: "254712345678"
