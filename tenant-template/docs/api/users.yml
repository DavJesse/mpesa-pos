openapi: 3.0.3
info:
  title: Tenant Users API
  description: API endpoints for managing tenant users (Admins, Managers, Tellers).
  version: 1.0.0
servers:
  - url: /api
    description: Tenant API
paths:
  /users:
    get:
      summary: List all users
      description: Returns a list of users. Managers only see users within their assigned branch. Admins see all users.
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A JSON array of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      summary: Create a new user
      description: Creates a new user. The assigned `role_id` cannot have a level higher than the creator's level. Managers can only assign users to their own `branch_id`.
      tags:
        - Users
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          description: Forbidden - Attempted privilege escalation or out-of-branch assignment.
        '422':
          description: Validation error

  /users/{id}:
    get:
      summary: Get a specific user
      tags:
        - Users
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
    put:
      summary: Update a user
      tags:
        - Users
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          description: Forbidden
        '404':
          description: User not found
    delete:
      summary: Delete a user
      tags:
        - Users
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: User deleted successfully
        '403':
          description: Forbidden
        '404':
          description: User not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "71b05d1c-b630-4e3d-82d3-1fc69c5e3d7a"
        name:
          type: string
          example: "John Doe"
        email:
          type: string
          format: email
          example: "john@example.com"
        role_id:
          type: integer
          example: 3
        branch_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UserInput:
      type: object
      required:
        - name
        - email
        - password
        - role_id
      properties:
        name:
          type: string
          example: "John Doe"
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        role_id:
          type: integer
          example: 3
        branch_id:
          type: string
          format: uuid
          nullable: true
        pos_pin:
          type: string
          description: A 4-6 digit PIN for manager overrides at the POS
          example: "1234"
