name: CI (Testing)

on:
  push:
    paths:
      - 'tenant-template/**'
      - '.github/workflows/tenant-template-ci.yml'
  pull_request:
    paths:
      - 'tenant-template/**'
      - '.github/workflows/tenant-template-ci.yml'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    # We specify the working directory so all 'run' commands happen inside the Laravel app
    defaults:
      run:
        working-directory: ./tenant-template
        
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0' # Adjust this to 8.3 if your host runs 8.3, kept at 8.0 for current composer.json compatibility
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath
          coverage: none
          
      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
        
      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('tenant-template/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-
            
      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --optimize-autoloader

      - name: Prepare Application Environment
        run: cp .env.example .env
        
      - name: Generate Application Key
        run: php artisan key:generate

      - name: Prepare SQLite Database
        run: |
          touch database/database.sqlite
          php artisan migrate --force
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
          
      - name: Execute Tests
        run: php artisan test
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
